  <head>
    <meta charset="UTF-8" />

    <meta name="color-scheme" content="light" />
    <title>Gray Brick Infra | Warehousing Solutions in Bengaluru</title>
    <meta
      name="description"
      content="Gray Brick Infra Pvt. Ltd. provides ready-to-move and built-to-suit warehousing, fulfillment centers and distribution facilities in and around Bengaluru."
    />

    <!--
      LOADER: critical styles are inline on purpose.

      The splash exists to cover the wait for the CSS and JS bundles, so it
      cannot wait for them itself. Everything it needs to paint on the first
      chunk of HTML is here: no stylesheet, no font, no image request. The mark
      is the real traced logo, generated by scripts/build-loader-svg.mjs.
    -->
    <style>
      .gbl-root {
        --gbl-wall: #242526;
        --gbl-wall-deep: #0d0e0f;
        --gbl-gold: #b19260;
        --gbl-gold-hi: #dbbb84;
        --gbl-gold-lo: #8b7045;
        --gbl-ink: rgba(209, 209, 207, 0.5);
        --gbl-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;

        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--gbl-wall-deep);
        transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .gbl-root.is-hidden {
        opacity: 0;
        transform: scale(1.05);
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0s 0.6s;
      }

      /* Body scroll is locked while the splash is up. */
      html.gbl-loading,
      html.gbl-loading body {
        overflow: hidden;
      }

      /* The wall the sign is mounted on. */
      .gbl-wall {
        position: absolute;
        inset: -2px;
        background-color: var(--gbl-wall);
        background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='120'%20height='60'%3E%3Cg%20fill='none'%20stroke='rgba(255,255,255,0.055)'%20stroke-width='1'%3E%3Cpath%20d='M0%20.5H120M0%2030.5H120'/%3E%3Cpath%20d='M.5%200V30M60.5%200V30M30.5%2030V60M90.5%2030V60'/%3E%3C/g%3E%3C/svg%3E");
        background-size: 120px 60px;
      }

      .gbl-wall::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 34%, rgba(255, 255, 255, 0.1), transparent 62%),
          radial-gradient(140% 120% at 50% 50%, transparent 38%, rgba(0, 0, 0, 0.72) 100%);
      }

      .gbl-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
      }

      .gbl-mark {
        display: block;
        width: min(330px, 62vw);
        height: auto;
        filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.55))
          drop-shadow(0 3px 2px rgba(0, 0, 0, 0.45));
      }

      .gbl-l,
      .gbl-wp {
        fill: url(#gblSteel);
      }

      .gbl-t,
      .gbl-w-gold .gbl-wp {
        fill: url(#gblGold);
      }

      .gbl-l,
      .gbl-t,
      .gbl-word {
        fill-rule: evenodd;
      }

      /* Build sequence: the mark rises out of its own baseline, gold last,
         then the wordmark settles under it. */
      .is-building .gbl-l,
      .is-building .gbl-t {
        animation: gbl-rise 0.9s cubic-bezier(0.16, 0.9, 0.3, 1) backwards;
      }

      .is-building .gbl-l1 { animation-delay: 0.05s; }
      .is-building .gbl-l2 { animation-delay: 0.17s; }
      .is-building .gbl-l3 { animation-delay: 0.29s; }
      .is-building .gbl-l4 { animation-delay: 0.41s; }
      .is-building .gbl-t1 { animation-delay: 0.56s; }
      .is-building .gbl-t2 { animation-delay: 0.66s; }

      .is-building .gbl-word {
        animation: gbl-lift 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) 1.02s backwards;
      }

      .is-building .gbl-bar {
        animation: gbl-lift 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) 1.32s backwards;
      }

      @keyframes gbl-rise {
        from { transform: translateY(560px); }
        to { transform: translateY(0); }
      }

      @keyframes gbl-lift {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: none; }
      }

      /* Progress. */
      .gbl-bar {
        margin-top: clamp(28px, 6vh, 46px);
        width: min(320px, 72vw);
      }

      .gbl-track {
        position: relative;
        height: 3px;
        overflow: hidden;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0.16) 12%,
          rgba(255, 255, 255, 0.16) 88%,
          rgba(255, 255, 255, 0)
        );
      }

      .gbl-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: linear-gradient(90deg, var(--gbl-gold-lo), var(--gbl-gold) 55%, var(--gbl-gold-hi));
        box-shadow: 0 0 14px rgba(177, 146, 96, 0.6);
        transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .gbl-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-top: 14px;
        font-family: var(--gbl-ui);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gbl-ink);
      }

      .gbl-pct {
        color: var(--gbl-gold);
        font-variant-numeric: tabular-nums;
      }

      /* Raking light across the sign. */
      .gbl-glint {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .gbl-glint::after {
        content: "";
        position: absolute;
        top: -25%;
        left: 0;
        width: 26%;
        height: 150%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.09) 34%,
          rgba(255, 255, 255, 0.3) 50%,
          rgba(255, 255, 255, 0.09) 66%,
          transparent
        );
        mix-blend-mode: color-dodge;
        transform: translateX(-140%) skewX(-14deg);
        animation: gbl-glint 4.2s cubic-bezier(0.55, 0, 0.45, 1) 1.9s infinite;
      }

      @keyframes gbl-glint {
        0% { transform: translateX(-140%) skewX(-14deg); }
        55%, 100% { transform: translateX(520%) skewX(-14deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .is-building .gbl-l,
        .is-building .gbl-t,
        .is-building .gbl-word,
        .is-building .gbl-bar,
        .gbl-glint::after {
          animation: none !important;
        }
        .gbl-root { transition: opacity 0.2s ease; }
      }
    </style>

    <!-- Without JavaScript nothing can dismiss the splash, so it must not exist. -->
    <noscript>
      <style>
        .gbl-root { display: none; }
        html.gbl-loading, html.gbl-loading body { overflow: auto; }
      </style>
    </noscript>
  </head>

    <script>
      /* Loader controller. Inline so it runs before the bundle and can always
         dismiss the splash, even if the bundle never arrives. */
      window.GrayBrickLoader = (function () {
        var root = document.getElementById('gbLoader')
        var fill = document.getElementById('gbFill')
        var pct = document.getElementById('gbPct')
        var status = document.getElementById('gbStatus')
        var shownAt = Date.now()
        var current = 0
        var loaded = false
        var done = false
        var frame

        /* The splash is shown for this long on every full page load or refresh.
           The bar is paced to fill across exactly this window. */
        var MIN_VISIBLE = 4000
        /* Nothing may trap a visitor behind the splash. */
        var HARD_LIMIT = 12000
        /* Until the page has actually loaded the bar stops here, so it never
           claims to be finished before it is. */
        var PENDING_CEILING = 92

        /* Monotonic. Module scripts defer DOMContentLoaded until after they
           execute, so naive milestones can arrive out of order and walk the
           bar backwards. */
        function setProgress(n) {
          var v = Math.max(0, Math.min(100, Math.round(n)))
          if (v <= current && v !== 100) return current
          current = v
          fill.style.width = v + '%'
          pct.textContent = v + '%'
          return v
        }

        function hide() {
          if (done) return
          done = true
          if (frame) cancelAnimationFrame(frame)
          setProgress(100)
          root.classList.add('is-hidden')
          root.setAttribute('aria-busy', 'false')
          document.documentElement.classList.remove('gbl-loading')
          setTimeout(function () {
            if (root.parentNode) root.parentNode.removeChild(root)
          }, 700)
        }

        /* Pace the bar against the display window rather than guessing at
           milestones. If the page really does take longer than the window, the
           bar waits at the ceiling instead of sitting full and lying about it. */
        function tick() {
          if (done) return
          var elapsed = Date.now() - shownAt
          setProgress(Math.min((elapsed / MIN_VISIBLE) * 100, loaded ? 100 : PENDING_CEILING))
          if (loaded && elapsed >= MIN_VISIBLE) return hide()
          frame = requestAnimationFrame(tick)
        }

        setProgress(0)
        frame = requestAnimationFrame(tick)
        setTimeout(hide, HARD_LIMIT)

        return {
          setProgress: setProgress,
          setStatus: function (t) {
            status.textContent = t
          },
          finish: function () {
            loaded = true
          },
          hide: hide,
        }
      })()
    </script>
