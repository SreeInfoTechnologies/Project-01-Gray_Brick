name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. The deploy job widens it only for itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR checks can be dropped; a deploy in flight must not be.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, build, verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Resolve deploy paths
        run: |
          # A project site is served from https://<owner>.github.io/<repo>/,
          # and GitHub lowercases the owner in that host name. Both are derived
          # rather than hard-coded so renaming the repo cannot silently break
          # every asset URL and canonical tag.
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          echo "VITE_SITE_URL=https://${owner_lc}.github.io" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      # A green build only proves the bundler did not throw. This checks the
      # things that actually break on Pages: the SPA fallback, a file behind
      # every route, asset URLs carrying the deploy base, and the inline splash
      # still being present with its dismissal guard.
      - name: Verify build output
        run: npm run verify:build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
